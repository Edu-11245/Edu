<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<script>try{var __t=localStorage.getItem("akd_theme");if(__t==="dark"||(__t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<title>أكاديميا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Data/lib/animate.min.css">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e8ebf3;--soft:#f6f7fc;--p:#4f46e5;--p2:#7c3aed;--ps:#eef0ff;--acc:#f59e0b;--ok:#059669;--err:#dc2626;
--sh:0 1px 2px rgba(15,23,42,.04),0 12px 32px -10px rgba(79,70,229,.16);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,Tahoma,sans-serif;color:var(--ink);background:#fff;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3,h4,.brand{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.35}
a{color:inherit;text-decoration:none}
button{font:inherit}
.hide{display:none!important}
.mut{color:var(--mut)}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(60vw 50vw at 100% -10%,#e6e9ff,transparent 70%),radial-gradient(50vw 45vw at -5% 105%,#f5e8ff,transparent 70%),#fff}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#c9cfe8 1px,transparent 1px);background-size:28px 28px;opacity:.4;-webkit-mask-image:linear-gradient(#000,transparent 65%);mask-image:linear-gradient(#000,transparent 65%)}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,2vw) scale(1.06)}66%{transform:translate(-2vw,3vw) scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes bar{0%{width:8%}100%{width:92%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:-200% 0}}
.rise{animation:rise .7s var(--ease) both}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.btn{font-weight:600;font-size:.95rem;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 10px 22px -10px rgba(79,70,229,.7);transition:transform .25s var(--ease),box-shadow .25s,opacity .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(79,70,229,.75)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--ps);color:var(--p);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft);border-color:#d3d8ee}
.btn.danger{background:#fff;color:var(--err);border:1px solid #fbd3d3;box-shadow:none}
.btn.danger:hover{background:#fff5f5}
.btn.sm{padding:7px 13px;font-size:.85rem;border-radius:10px}
.btn.ico{padding:8px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.load::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite}
:focus-visible{outline:3px solid rgba(79,70,229,.4);outline-offset:2px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.85rem;font-weight:600;color:#334155;margin-bottom:6px}
.ib{position:relative}
.ib>.ic{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;color:#94a3b8;pointer-events:none;transition:color .2s}
.ib:focus-within>.ic{color:var(--p)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
.ib input{padding-inline-start:44px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
input::placeholder,textarea::placeholder{color:#a3adc2}
input[type=file]{padding:9px;font-size:.9rem}
.err{color:var(--err);font-weight:600;font-size:.88rem;min-height:1.4em}
.okm{color:var(--ok)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.chip.ok{background:#e8f8f1;color:var(--ok);border-color:#c5ecdb}
.chip.no{background:#fdecec;color:var(--err);border-color:#f8cfcf}
.chip.wait{background:#fff5df;color:#b45309;border-color:#fbe3ac}
.chip.pr{background:var(--ps);color:var(--p);border-color:#dadcff}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.1rem "Readex Pro",sans-serif;flex:none;overflow:hidden;box-shadow:0 6px 14px -6px rgba(15,23,42,.35)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:28px;height:28px;font-size:.8rem;box-shadow:none}
.av.lg{width:84px;height:84px;font-size:2rem}
.av.xl{width:116px;height:116px;font-size:2.8rem;border:4px solid #fff}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;box-shadow:0 10px 20px -8px rgba(79,70,229,.7)}
.logo .ic{width:22px;height:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem}
.empty{text-align:center;color:var(--mut);padding:44px 16px;border:1.5px dashed #d6dbee;border-radius:20px;background:rgba(255,255,255,.6)}
.empty .ic{width:34px;height:34px;color:#b4bcd6;margin-bottom:8px}
.sk{border-radius:20px;height:250px;background:linear-gradient(100deg,#f3f4fa 40%,#fff 50%,#f3f4fa 60%);background-size:200% 100%;animation:shine 1.4s linear infinite}
.auth{flex:1;display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:center;max-width:1240px;margin:0 auto;width:100%;padding:clamp(20px,4vw,48px)}
.auth-card{padding:clamp(22px,4vw,38px)}
.auth h1{font-size:clamp(1.6rem,3.4vw,2.1rem);margin:22px 0 6px}
.auth .sub{color:var(--mut);margin-bottom:22px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{position:relative;z-index:1;background:none;border:0;padding:10px;cursor:pointer;color:var(--mut);font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;transition:color .3s}
.seg button[aria-pressed=true]{color:var(--p)}
.seg .th{position:absolute;z-index:0;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(15,23,42,.1);transition:inset-inline-start .45s var(--ease)}
.seg[data-v="1"] .th{inset-inline-start:50%}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease),opacity .35s}
.fold>div{overflow:hidden;min-height:0}
.fold.off{grid-template-rows:0fr;opacity:0}
.link{background:none;border:0;color:var(--p);font-weight:600;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.show{position:relative;min-height:560px;border-radius:34px;background:linear-gradient(160deg,#fff,#eef0ff 55%,#f6e9ff);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.show h2{font-size:clamp(1.6rem,2.6vw,2.2rem)}
.show h2 em,.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--p),var(--p2) 60%,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.mock{position:relative;aspect-ratio:16/9;border-radius:22px;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#c026d3);box-shadow:0 30px 50px -24px rgba(79,70,229,.7);display:grid;place-items:center;overflow:hidden;transform:rotate(-2deg);transition:transform .6s var(--ease)}
.show:hover .mock{transform:rotate(0)}
.mock::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 45%)}
.mock .pl{position:relative;width:74px;height:74px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center}
.mock .pl .ic{width:30px;height:30px;fill:currentColor}
.mock .pl::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;opacity:.35;transform:scale(1.25)}
.mock .pb{position:absolute;inset-inline:18px;bottom:16px;height:6px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.mock .pb::after{content:"";display:block;height:100%;background:#fff;border-radius:9px;width:45%}
.fl{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 16px;box-shadow:0 18px 36px -16px rgba(15,23,42,.3);font-weight:600;font-size:.9rem;}
.fl .ic{color:var(--p);width:20px;height:20px}
.fl.a{top:28%;inset-inline-end:-6px;animation-delay:-1s}
.fl.b{bottom:30%;inset-inline-start:-8px;animation-delay:-3s}
.fl.c{top:7%;inset-inline-start:34px;animation-delay:-4.5s}
.dots{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
.dots span{display:flex;align-items:center;gap:7px}.dots .ic{color:var(--ok)}
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.nav>div{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.nav .links{display:flex;gap:4px;padding:4px;margin-inline:auto;background:var(--soft);border:1px solid var(--line);border-radius:16px}
.nav .links a{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px;border-radius:12px;color:var(--mut);font-weight:600;font-size:.92rem;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s}
.nav .links a:hover{color:var(--ink)}
.nav .links a.on{background:#fff;color:var(--p);box-shadow:0 3px 10px rgba(15,23,42,.09)}
.me{display:flex;align-items:center;gap:10px;padding:4px;padding-inline-end:16px;background:#fff;border:1px solid var(--line);border-radius:99px;transition:border-color .2s,box-shadow .2s}
.me:hover{border-color:#cfd5f0;box-shadow:0 6px 16px -10px rgba(79,70,229,.45)}
.me b{display:block;font-size:.88rem;line-height:1.25}.me small{display:block;color:var(--mut);font-size:.75rem;line-height:1.25}
.me .av{width:40px;height:40px;font-size:.95rem;border:2px solid var(--ps);box-shadow:none}
.nav #thm{padding:9px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:30px 20px 56px}
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(28px,5vw,60px);border-radius:32px;color:#fff;overflow:hidden;margin-bottom:12px;background:radial-gradient(60% 90% at 0% 0%,rgba(167,139,250,.5),transparent 65%),linear-gradient(135deg,#312e81,#4338ca 55%,#5b21b6);box-shadow:0 34px 60px -34px rgba(67,56,202,.75)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(135deg,#000,transparent 60%);mask-image:linear-gradient(135deg,#000,transparent 60%)}
.eyebrow{display:inline-flex;gap:7px;align-items:center;background:var(--ps);color:var(--p);font-weight:600;font-size:.85rem;padding:5px 14px;border-radius:99px}
.hero .eyebrow{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.22)}
.hero h1{font-size:clamp(1.9rem,4.2vw,3rem);margin:16px 0 12px;letter-spacing:-.01em}
.hero h1 em{display:block;font-style:normal;color:rgba(255,255,255,.72);background:none;-webkit-text-fill-color:currentColor}
.hero p{color:rgba(255,255,255,.82);max-width:33rem;margin-bottom:24px;font-size:1.02rem}
.srch{position:relative;max-width:480px}
.srch .ic{position:absolute;inset-inline-start:18px;top:50%;translate:0 -50%;color:#94a3b8;width:1.3em;height:1.3em}
.srch input{padding:16px 18px;padding-inline-start:52px;border-radius:18px;border:0;background:#fff;font-size:1rem;box-shadow:0 18px 34px -16px rgba(15,23,42,.55)}
.srch input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.35),0 18px 34px -16px rgba(15,23,42,.55)}
.hero :focus-visible{outline-color:rgba(255,255,255,.7)}
.hstats{display:grid;gap:12px}
.hstats>div{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.22);border-radius:20px;padding:14px 18px;display:flex;align-items:center;gap:16px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 14px 30px -20px rgba(15,23,42,.6);animation:hsIn .65s var(--ease) both;animation-delay:calc(var(--i,0)*120ms + 150ms);transition:transform .3s var(--ease),background .3s}
.hstats>div:hover{transform:translateY(-4px)}
.hstats .hi{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;flex:none;color:#fff;transition:transform .35s var(--ease)}
.hstats>div:hover .hi{transform:rotate(-8deg) scale(1.1)}
.hstats .hi .ic{width:22px;height:22px}
.hstats .ht{min-width:0}
.hstats b{display:block;font:700 1.9rem "Readex Pro",sans-serif;color:#fff;min-width:2.6ch;line-height:1.2;font-variant-numeric:tabular-nums}
.hstats b.bump{animation:hsBump .5s var(--ease)}
.hstats span.mut{display:block;color:rgba(255,255,255,.78);font-size:.92rem}
.hstats .hot::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);transform:translateX(-130%);animation:hsShine 6s ease-in-out 2s infinite}
.hstats .live{position:absolute;inset-block-start:12px;inset-inline-end:14px;width:8px;height:8px;border-radius:50%;background:#34d399}
.hstats .live::after{content:"";position:absolute;inset:0;border-radius:50%;background:#34d399;animation:hsPing 2s ease-out infinite}
@keyframes hsIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes hsBump{40%{transform:scale(1.14)}}
@keyframes hsShine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes hsPing{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
.cfx{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;overflow:visible;pointer-events:none;z-index:99999}
/* tilt + glare on cards (mouse devices only) */
@media(hover:hover) and (pointer:fine){
.cc{position:relative}
.cc:hover,.tc:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px)}
.cc.tilting,.tc.tilting{transition:transform .12s linear,box-shadow .4s}
.cc::after,.tc::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(129,140,248,.18),transparent 55%)}
.cc:hover::after,.tc:hover::after{opacity:1}
}
/* smooth page transitions (View Transitions API, falls back to the old rise) */
.nav{view-transition-name:nav}
::view-transition-old(nav),::view-transition-new(nav){animation:none;mix-blend-mode:normal}
::view-transition-old(root){animation:vtOut .16s ease both}
::view-transition-new(root){animation:vtIn .34s var(--ease) both}
@keyframes vtOut{to{opacity:0;transform:translateY(-6px)}}
@keyframes vtIn{from{opacity:0;transform:translateY(14px)}}
/* subject colours + icons */
.chip.sb{background:hsl(var(--sh) 90% 95%);color:hsl(var(--sh) 62% 34%);border-color:hsl(var(--sh) 75% 86%)}
.chip.sb .ic{width:.95em;height:.95em}
[data-theme=dark] .chip.sb{background:hsl(var(--sh) 38% 20%);color:hsl(var(--sh) 85% 80%);border-color:hsl(var(--sh) 32% 32%)}
.cv .big,.cover .big,.ct .big{display:grid;place-items:center;transition:transform .5s var(--ease);position:relative;z-index:1}
.cv .big .ic,.cover .big .ic,.ct .big .ic{width:1.15em;height:1.15em;stroke-width:1.5;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22))}
.cc:hover .big{transform:scale(1.12) rotate(-6deg)}
.cv .wm,.cover .wm{position:absolute;inset-inline-end:-14px;bottom:-22px;opacity:.14;transform:rotate(-14deg);pointer-events:none}
.cv .wm .ic,.cover .wm .ic{width:130px;height:130px;stroke-width:1.2}
.cv .sbj{position:absolute;inset-inline-start:12px;top:12px;width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.93);color:hsl(var(--sh) 65% 42%);display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.cv .sbj .ic{width:18px;height:18px}
.fchips button .ic{width:1em;height:1em;margin-inline-end:5px;vertical-align:-.14em}
/* achievement badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.bdg{padding:18px 12px;text-align:center;display:grid;justify-items:center;gap:6px;transition:transform .3s var(--ease)}
.bdg:hover{transform:translateY(-4px)}
.bdg .bi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--sh) 75% 58%),hsl(calc(var(--sh) + 35) 78% 46%));box-shadow:0 10px 20px -10px hsl(var(--sh) 80% 40%),inset 0 0 0 3px rgba(255,255,255,.35)}
.bdg .bi .ic{width:26px;height:26px}
.bdg b{font-size:.95rem}.bdg small{color:var(--mut);font-size:.8rem;line-height:1.5}
.bdg.off{opacity:.55}.bdg.off .bi{background:var(--soft);color:var(--mut);box-shadow:inset 0 0 0 2px var(--line)}
.bdg.on{animation:pop .5s var(--ease) both}
.sec{margin-top:40px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-size:1.4rem;display:flex;align-items:center;gap:10px}
.sh h2::before{content:"";width:6px;height:24px;border-radius:9px;background:linear-gradient(var(--p),var(--p2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.cc{display:flex;flex-direction:column;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s}
.cc:hover{transform:translateY(-6px);box-shadow:0 26px 44px -18px rgba(79,70,229,.32)}
.cv{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 3.2rem "Readex Pro",sans-serif}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.cc:hover .cv img{transform:scale(1.07)}
.cv .pill{position:absolute;inset-inline-end:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(0,0,0,.35);transform:scale(.8);opacity:0;transition:.35s var(--ease)}
.cv .pill .ic{fill:currentColor}
.cc:hover .pill{transform:none;opacity:1}

      if (b.dataset.ok) { b.disabled = true; const key = r.type === "course" ? r.courseId : r.lectureId;
        await update(ref(db), { [`enrollments/${r.uid}/${key}`]: { teacherId: U.uid, courseId: r.courseId, lectureId: r.lectureId || null, at: serverTimestamp() }, [`requests/${U.uid}/${id}/status`]: "approved", [`requests/${U.uid}/${id}/decidedAt`]: serverTimestamp(), [`studentRequests/${r.uid}/${id}/status`]: "approved" });
        const sent = await mail("تمت الموافقة على اشتراكك", `تمت الموافقة على طلبك للاشتراك في "${r.title}". تقدر تدخل المنصة وتبدأ المشاهدة دلوقتي.`); toast(sent ? "تمت الموافقة وبعتنا رسالة للطالب" : "تمت الموافقة (الرسالة ماتبعتتش، راجع EmailJS)") }
      if (b.dataset.no) { const v = await ask("رفض الطلب", [{ k: "reason", label: "سبب الرفض (هيظهر للطالب)", req: 1 }], "رفض"); if (!v) return;
        await update(ref(db), { [`requests/${U.uid}/${id}/status`]: "rejected", [`requests/${U.uid}/${id}/reason`]: v.reason, [`requests/${U.uid}/${id}/decidedAt`]: serverTimestamp(), [`studentRequests/${r.uid}/${id}/status`]: "rejected", [`studentRequests/${r.uid}/${id}/reason`]: v.reason });
        await mail("بخصوص طلب اشتراكك", `للأسف تعذّر قبول طلبك للاشتراك في "${r.title}". السبب: ${v.reason}.`); toast("تم الرفض") } });
  }
  if (tab === "courses") {
    paint = again => { tabsHtml(); const cs = coursesOf(U.uid);
      T.innerHTML = `<div class="grid"><button class="card cc" id="nc" style="min-height:240px;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:2px dashed var(--line);box-shadow:none;background:transparent;color:var(--p);font-weight:700">${ic("plus")}<span>كورس جديد</span></button>${cs.map(courseCard).join("")}</div>`;
      $("nc").onclick = addCourse; reveal(true) };
  }
  if (tab === "students") {
    T.innerHTML = `<div class="sh"><h2>المشاهدات</h2></div><div class="srch" style="max-width:none;margin-bottom:14px">${ic("search")}<input id="q" placeholder="ابحث باسم الطالب أو الحصة"></div><div class="card tw" id="vw"></div><div class="sh" style="margin-top:34px"><h2>الطلاب المشتركين</h2></div><div class="card tw" id="st"></div>`;
    paint = () => { tabsHtml(); const f = $("q").value.trim().toLowerCase();
      $("vw").innerHTML = `<table><thead><tr><th>الطالب</th><th>الكورس</th><th>الحصة</th><th>المشاهدات</th><th>آخر مشاهدة</th></tr></thead><tbody>${arr(D.views).filter(v => !f || (v.name + " " + v.lt + " " + v.ct).toLowerCase().includes(f)).sort((a, b) => (b.last || 0) - (a.last || 0)).map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.ct)}</td><td>${esc(v.lt)}</td><td>${v.count || 1}</td><td>${day(v.last)}</td></tr>`).join("") || '<tr><td colspan="5" class="mut">مفيش مشاهدات.</td></tr>'}</tbody></table>`;
      const m = {}; arr(D.reqs).filter(r => r.status === "approved").forEach(r => { (m[r.uid] ||= { name: r.name, phone: r.phone, email: r.email, n: 0 }).n++ });
      $("st").innerHTML = `<table><thead><tr><th>الاسم</th><th>الموبايل</th><th>الإيميل</th><th>اشتراكات</th></tr></thead><tbody>${Object.values(m).map(s => `<tr><td>${esc(s.name)}</td><td dir="ltr">${esc(s.phone)}</td><td dir="ltr">${esc(s.email)}</td><td>${s.n}</td></tr>`).join("") || '<tr><td colspan="4" class="mut">مفيش طلاب لسه.</td></tr>'}</tbody></table>` };
    $("q").oninput = () => paint();
  }
  if (tab === "page") {
    const t = D.teachers[U.uid] || {}, pay = t.pay || {}, ms = Object.values(pay.methods || {}), link = location.origin + location.pathname + "#/t/" + U.uid;
    T.innerHTML = `<div class="two"><div class="card pad"><h3>بيانات صفحتي</h3>
      <div class="fld"><label for="s-n">الاسم</label><input id="s-n" value="${esc(t.name || P.name)}"></div><div class="fld"><label for="s-t">التخصص</label><input id="s-t" value="${esc(t.title || "")}" placeholder="مثال: مدرس رياضيات"></div>
      <div class="fld"><label for="s-b">نبذة عنك</label><textarea id="s-b" rows="4">${esc(t.bio || "")}</textarea></div><div class="fld"><label for="s-p">صورتك الشخصية</label><input id="s-p" type="file" accept="image/*"></div><div class="fld"><label for="s-cv">صورة الغلاف</label><input id="s-cv" type="file" accept="image/*"></div>
      <div class="fld"><label>رابط صفحتك</label><div class="row"><input readonly dir="ltr" value="${esc(link)}" style="flex:1;min-width:180px"><button class="btn ghost sm" id="cl">${ic("copy")}نسخ</button></div></div>
      <button class="btn" id="sv">حفظ البيانات</button></div>
      <div><div class="card pad" style="margin-bottom:20px"><h3>طرق الدفع</h3>${[0, 1, 2].map(i => `<div class="row" style="margin-bottom:10px"><input style="flex:1;min-width:130px" id="pn${i}" placeholder="الطريقة (فودافون كاش)" value="${esc(ms[i]?.name || "")}"><input style="flex:1;min-width:130px" dir="ltr" id="pm${i}" placeholder="الرقم" value="${esc(ms[i]?.number || "")}"></div>`).join("")}
        <div class="fld"><label for="pi">رسالة الدفع للطالب (اختياري)</label><textarea id="pi" rows="3">${esc(pay.instructions || "")}</textarea></div><button class="btn" id="sp">حفظ طرق الدفع</button></div>
      <div class="card pad"><h3>تغيير الباسوورد</h3><div class="fld"><label for="po">الحالي</label><input id="po" type="password" autocomplete="current-password"></div><div class="fld"><label for="pn">الجديد</label><input id="pnw" type="password" autocomplete="new-password"></div><button class="btn ghost" id="cp">تغيير الباسوورد</button></div></div></div>`;
    paint = () => tabsHtml();
    $("cl").onclick = () => { navigator.clipboard.writeText(link); toast("تم نسخ الرابط") };
    $("sv").onclick = safe(async () => { const name = $("s-n").value.trim(); if (name.length < 2) return toast("اكتب الاسم", false);
      const u = { [`teachers/${U.uid}/name`]: name, [`teachers/${U.uid}/title`]: $("s-t").value.trim(), [`teachers/${U.uid}/bio`]: $("s-b").value.trim(), [`users/${U.uid}/name`]: name }; const f = $("s-p").files[0]; if (f) u[`teachers/${U.uid}/photo`] = await compress(f, 240, .7); const g = $("s-cv").files[0]; if (g) u[`teachers/${U.uid}/cover`] = await compress(g, 1000, .55);
      await update(ref(db), u); P.name = name; refreshMe(); toast("تم حفظ بيانات الصفحة") });
    $("sp").onclick = safe(async () => { const methods = [0, 1, 2].map(i => ({ name: $("pn" + i).value.trim(), number: $("pm" + i).value.trim() })).filter(m => m.number);
      await update(ref(db), { [`teachers/${U.uid}/pay`]: { instructions: $("pi").value.trim(), methods: methods.length ? methods : null } }); toast("تم حفظ طرق الدفع") });
    $("cp").onclick = safe(async () => { try { await reauthenticateWithCredential(U, EmailAuthProvider.credential(U.email, $("po").value)); await updatePassword(U, $("pnw").value); $("po").value = $("pnw").value = ""; toast("تم تغيير الباسوورد") }
      catch (e) { toast(e.code === "auth/weak-password" ? "الباسوورد الجديد ضعيف" : "الباسوورد الحالي غلط", false) } });
  }
  paint();
}
onAuthStateChanged(auth, u => { if (holding) return; if (u) { if (!U || U.uid !== u.uid) enter(u).catch(e => { console.error(e); toast("تعذّر تحميل البيانات. اتأكد من databaseURL والرولز", false); signOut(auth) }) } else leave() });
</script>
</body>
</html>
