<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>أكاديميا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e8ebf3;--soft:#f6f7fc;--p:#4f46e5;--p2:#7c3aed;--ps:#eef0ff;--acc:#f59e0b;--ok:#059669;--err:#dc2626;
--sh:0 1px 2px rgba(15,23,42,.04),0 12px 32px -10px rgba(79,70,229,.16);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,Tahoma,sans-serif;color:var(--ink);background:#fff;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3,h4,.brand{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.35}
a{color:inherit;text-decoration:none}
button{font:inherit}
.hide{display:none!important}
.mut{color:var(--mut)}
.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- الخلفية ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#fff;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.6;animation:float 20s ease-in-out infinite}
.bg i:nth-child(1){width:46vw;height:46vw;background:#dfe3ff;top:-14vw;inset-inline-end:-10vw}
.bg i:nth-child(2){width:38vw;height:38vw;background:#f3e1ff;bottom:-16vw;inset-inline-start:-8vw;animation-delay:-7s}
.bg i:nth-child(3){width:24vw;height:24vw;background:#ffeccc;top:46%;inset-inline-start:34%;opacity:.35;animation-delay:-12s}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#c9cfe8 1px,transparent 1px);background-size:28px 28px;opacity:.4;-webkit-mask-image:linear-gradient(#000,transparent 65%);mask-image:linear-gradient(#000,transparent 65%)}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(3vw,2vw) scale(1.06)}66%{transform:translate(-2vw,3vw) scale(.96)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes bar{0%{width:8%}100%{width:92%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:-200% 0}}
.rise{animation:rise .7s var(--ease) both}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

/* ---------- عناصر عامة ---------- */
.btn{font-weight:600;font-size:.95rem;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 10px 22px -10px rgba(79,70,229,.7);transition:transform .25s var(--ease),box-shadow .25s,opacity .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(79,70,229,.75)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--ps);color:var(--p);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft);border-color:#d3d8ee}
.btn.danger{background:#fff;color:var(--err);border:1px solid #fbd3d3;box-shadow:none}
.btn.danger:hover{background:#fff5f5}
.btn.sm{padding:7px 13px;font-size:.85rem;border-radius:10px}
.btn.ico{padding:8px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.load::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite}
:focus-visible{outline:3px solid rgba(79,70,229,.4);outline-offset:2px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:.85rem;font-weight:600;color:#334155;margin-bottom:6px}
.ib{position:relative}
.ib>.ic{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;color:#94a3b8;pointer-events:none;transition:color .2s}
.ib:focus-within>.ic{color:var(--p)}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .2s,box-shadow .2s}
.ib input{padding-inline-start:44px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 4px rgba(79,70,229,.12)}
input::placeholder,textarea::placeholder{color:#a3adc2}
input[type=file]{padding:9px;font-size:.9rem}
.err{color:var(--err);font-weight:600;font-size:.88rem;min-height:1.4em}
.okm{color:var(--ok)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--soft);color:var(--mut);border:1px solid var(--line)}
.chip.ok{background:#e8f8f1;color:var(--ok);border-color:#c5ecdb}
.chip.no{background:#fdecec;color:var(--err);border-color:#f8cfcf}
.chip.wait{background:#fff5df;color:#b45309;border-color:#fbe3ac}
.chip.pr{background:var(--ps);color:var(--p);border-color:#dadcff}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.1rem "Readex Pro",sans-serif;flex:none;overflow:hidden;box-shadow:0 6px 14px -6px rgba(15,23,42,.35)}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:28px;height:28px;font-size:.8rem;box-shadow:none}
.av.lg{width:84px;height:84px;font-size:2rem}
.av.xl{width:116px;height:116px;font-size:2.8rem;border:4px solid #fff}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;box-shadow:0 10px 20px -8px rgba(79,70,229,.7)}
.logo .ic{width:22px;height:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem}
.empty{text-align:center;color:var(--mut);padding:44px 16px;border:1.5px dashed #d6dbee;border-radius:20px;background:rgba(255,255,255,.6)}
.empty .ic{width:34px;height:34px;color:#b4bcd6;margin-bottom:8px}
.sk{border-radius:20px;height:250px;background:linear-gradient(100deg,#f3f4fa 40%,#fff 50%,#f3f4fa 60%);background-size:200% 100%;animation:shine 1.4s linear infinite}

/* ---------- صفحة الدخول ---------- */
.auth{flex:1;display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);gap:clamp(24px,5vw,80px);align-items:center;max-width:1240px;margin:0 auto;width:100%;padding:clamp(20px,4vw,48px)}
.auth-card{padding:clamp(22px,4vw,38px)}
.auth h1{font-size:clamp(1.6rem,3.4vw,2.1rem);margin:22px 0 6px}
.auth .sub{color:var(--mut);margin-bottom:22px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{position:relative;z-index:1;background:none;border:0;padding:10px;cursor:pointer;color:var(--mut);font-weight:600;display:flex;gap:8px;align-items:center;justify-content:center;transition:color .3s}
.seg button[aria-pressed=true]{color:var(--p)}
.seg .th{position:absolute;z-index:0;top:4px;bottom:4px;width:calc(50% - 4px);inset-inline-start:4px;background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(15,23,42,.1);transition:inset-inline-start .45s var(--ease)}
.seg[data-v="1"] .th{inset-inline-start:50%}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s var(--ease),opacity .35s}
.fold>div{overflow:hidden;min-height:0}
.fold.off{grid-template-rows:0fr;opacity:0}
.link{background:none;border:0;color:var(--p);font-weight:600;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.show{position:relative;min-height:560px;border-radius:34px;background:linear-gradient(160deg,#fff,#eef0ff 55%,#f6e9ff);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.show h2{font-size:clamp(1.6rem,2.6vw,2.2rem)}
.show h2 em,.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--p),var(--p2) 60%,#d946ef);-webkit-background-clip:text;background-clip:text;color:transparent}
.mock{position:relative;aspect-ratio:16/9;border-radius:22px;background:linear-gradient(135deg,#4f46e5,#7c3aed 60%,#c026d3);box-shadow:0 30px 50px -24px rgba(79,70,229,.7);display:grid;place-items:center;overflow:hidden;transform:rotate(-2deg);transition:transform .6s var(--ease)}
.show:hover .mock{transform:rotate(0)}
.mock::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.35),transparent 45%)}
.mock .pl{position:relative;width:74px;height:74px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center}
.mock .pl .ic{width:30px;height:30px;fill:currentColor}
.mock .pl::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #fff;animation:ring 2s ease-out infinite}
.mock .pb{position:absolute;inset-inline:18px;bottom:16px;height:6px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.mock .pb::after{content:"";display:block;height:100%;background:#fff;border-radius:9px;animation:bar 9s ease-in-out infinite alternate}
.fl{position:absolute;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 16px;box-shadow:0 18px 36px -16px rgba(15,23,42,.3);font-weight:600;font-size:.9rem;animation:bob 6s ease-in-out infinite}
.fl .ic{color:var(--p);width:20px;height:20px}
.fl.a{top:28%;inset-inline-end:-6px;animation-delay:-1s}
.fl.b{bottom:30%;inset-inline-start:-8px;animation-delay:-3s}
.fl.c{top:7%;inset-inline-start:34px;animation-delay:-4.5s}
.dots{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
.dots span{display:flex;align-items:center;gap:7px}.dots .ic{color:var(--ok)}

/* ---------- الشريط العلوي ---------- */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.nav>div{max-width:1180px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:18px}
.nav .links{display:flex;gap:4px;margin-inline-end:auto}
.nav .links a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;color:var(--mut);font-weight:600;font-size:.93rem;transition:background .2s,color .2s}
.nav .links a:hover{background:var(--soft);color:var(--ink)}
.nav .links a.on{background:var(--ps);color:var(--p)}
.me{display:flex;align-items:center;gap:10px}
.me b{display:block;font-size:.88rem;line-height:1.2}.me small{color:var(--mut);font-size:.75rem}
.me .av{width:38px;height:38px;font-size:.95rem}

/* ---------- الصفحات ---------- */
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:30px 20px 56px}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center;padding:clamp(24px,4vw,46px);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(238,240,255,.85));border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:12px}
.eyebrow{display:inline-flex;gap:7px;align-items:center;background:var(--ps);color:var(--p);font-weight:600;font-size:.85rem;padding:5px 14px;border-radius:99px}
.hero h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:14px 0 10px}
.hero p{color:var(--mut);max-width:34rem;margin-bottom:20px}
.srch{position:relative;max-width:460px}
.srch .ic{position:absolute;inset-inline-start:16px;top:50%;translate:0 -50%;color:#94a3b8}
.srch input{padding:14px 16px;padding-inline-start:46px;border-radius:16px;box-shadow:0 10px 24px -14px rgba(79,70,229,.4)}
.hstats{display:grid;gap:12px}
.hstats>div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;transition:transform .3s var(--ease)}
.hstats>div:hover{transform:translateX(-6px)}
.hstats b{font:700 1.7rem "Readex Pro",sans-serif;color:var(--p);min-width:2.4ch}
.sec{margin-top:40px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-size:1.4rem;display:flex;align-items:center;gap:10px}
.sh h2::before{content:"";width:6px;height:24px;border-radius:9px;background:linear-gradient(var(--p),var(--p2))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.cc{display:flex;flex-direction:column;overflow:hidden;transition:transform .4s var(--ease),box-shadow .4s}
.cc:hover{transform:translateY(-6px);box-shadow:0 26px 44px -18px rgba(79,70,229,.32)}
.cv{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;color:#fff;font:700 3.2rem "Readex Pro",sans-serif}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.cc:hover .cv img{transform:scale(1.07)}
.cv .pill{position:absolute;inset-inline-end:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(0,0,0,.35);transform:scale(.8);opacity:0;transition:.35s var(--ease)}
.cv .pill .ic{fill:currentColor}
.cc:hover .pill{transform:none;opacity:1}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:1.05rem}
.cb p{color:var(--mut);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.cm{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;margin-top:6px;color:#334155}
.tscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:16px;overflow-x:auto;padding:6px 4px 16px;scroll-snap-type:x proximity}
.tc{padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:start;transition:transform .4s var(--ease),box-shadow .4s}
.tc:hover{transform:translateY(-6px);box-shadow:0 26px 44px -18px rgba(79,70,229,.32)}
.tc .av{margin-bottom:8px}.tc p{color:var(--mut);font-size:.88rem;margin-bottom:8px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:.9rem;margin-bottom:14px}
.back:hover{color:var(--p)}.flip{transform:scaleX(-1)}
.cover{border-radius:28px;overflow:hidden;position:relative;aspect-ratio:21/8;min-height:180px;display:grid;place-items:center;color:#fff;font:700 4rem "Readex Pro",sans-serif;margin-bottom:-52px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(15,23,42,.25))}
.cinfo{position:relative;margin-inline:clamp(10px,3vw,30px);padding:clamp(18px,3vw,28px)}
.cinfo h1{font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:6px}
.cinfo>p{color:var(--mut);margin:8px 0 14px;max-width:46rem}
.lec{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;transition:background .2s}
.lec:last-child{border:0}.lec:hover{background:#fafbff}
.lec .n{width:38px;height:38px;border-radius:12px;background:var(--ps);color:var(--p);display:grid;place-items:center;font:700 .95rem "Readex Pro",sans-serif;flex:none}
.lec.lk .n{background:var(--soft);color:#94a3b8}
.lec .li{flex:1;min-width:180px}.lec .li small{display:block;color:var(--mut);line-height:1.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;padding:5px;background:var(--soft);border:1px solid var(--line);border-radius:16px;width:fit-content;max-width:100%}
.tabs a{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:12px;font-weight:600;color:var(--mut);font-size:.92rem;transition:.25s}
.tabs a.on{background:#fff;color:var(--p);box-shadow:0 3px 10px rgba(15,23,42,.08)}
.tabs .cnt{background:var(--err);color:#fff;border-radius:99px;font-size:.72rem;padding:0 7px;line-height:1.5}
.rq{padding:18px 20px;margin-bottom:14px}
.rq .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 18px;margin:12px 0 14px;font-size:.9rem}
.rq .kv span{color:var(--mut);display:block;font-size:.76rem}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);font-size:.9rem}
th{color:var(--mut);font-size:.8rem;background:var(--soft);font-weight:600}
tr:last-child td{border:0}
.pm{border:1.5px dashed #cfd5ea;border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.mono{font:700 1.1rem ui-monospace,Consolas,monospace;direction:ltr;letter-spacing:1.5px;display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.pad{padding:clamp(18px,3vw,28px)}
.pad h3{margin-bottom:14px}

/* ---------- نافذة ---------- */
dialog{border:0;border-radius:26px;padding:0;width:min(520px,94vw);max-height:92vh;max-height:92dvh;box-shadow:0 40px 90px -24px rgba(15,23,42,.5);color:var(--ink);animation:pop .4s var(--ease);margin:auto}
dialog::backdrop{background:rgba(15,23,42,.5);backdrop-filter:blur(7px);animation:fade .3s}
#mb{padding:24px;overflow:auto;max-height:92vh;max-height:92dvh}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--mut);transition:.2s;flex:none}
.x:hover{background:var(--soft);color:var(--ink)}
dialog.wide{width:min(980px,96vw);background:#0a0f1f;color:#fff}
dialog.wide .x{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
dialog.wide #mb{padding:18px}
.vbox{position:relative;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vtop{position:absolute;inset:0 0 auto 0;height:58px;z-index:3}
.wm{position:absolute;z-index:4;pointer-events:none;color:rgba(255,255,255,.55);font-weight:600;font-size:clamp(.7rem,1.6vw,.95rem);text-shadow:0 1px 3px rgba(0,0,0,.8);padding:3px 10px;background:rgba(0,0,0,.18);border-radius:8px;transition:top 2.5s ease-in-out,inset-inline-start 2.5s ease-in-out;direction:ltr;white-space:nowrap}
.vmask{position:absolute;inset:0;z-index:6;background:#0a0f1f;color:#cbd5e1;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s;text-align:center;padding:20px}
.vmask .ic{width:34px;height:34px}
.vbox.cover .vmask{opacity:1;pointer-events:auto}
.vnote{display:flex;gap:8px;align-items:center;color:#94a3b8;font-size:.82rem;margin-top:12px}
.vnote .ic{color:#34d399}

/* ---------- الفوتر ---------- */
.foot{margin-top:auto;border-top:1px solid var(--line);background:rgba(255,255,255,.75);backdrop-filter:blur(10px)}
.foot .fw{max-width:1180px;margin:0 auto;padding:38px 20px 22px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}

async function enter(u) {

  const [t, c] = await Promise.all([get(ref(db, "teachers")), get(ref(db, "courses"))]);
  D.teachers = t.val() || {}; D.courses = c.val() || {};
  if (P.role === "teacher" && !D.teachers[u.uid]) { const tp = { name: P.name, title: P.title || "", bio: "" }; await set(ref(db, "teachers/" + u.uid), tp); D.teachers[u.uid] = tp }

  else { listen("requests/" + u.uid, "reqs"); listen("views/" + u.uid, "views") }

}

function route() {

  if (m = h.match(/^#\/course\/(.+)$/)) { pageCourse(m[1]); markNav(t ? "" : "home") }

function player(c, l, url) {
  const file = isFile(url);
  modal(`<div class="mh"><div><h3>${esc(l.title)}</h3><small style="color:#94a3b8">${esc(c.title)}</small></div><div class="row"><button class="x" id="fs" title="ملء الشاشة">${ic("full")}</button><button class="x" data-close aria-label="إغلاق">${ic("x")}</button></div></div>
    <div class="vbox" id="vb">${file ? `<video src="${esc(url)}" controls controlsList="nodownload noplaybackrate" disablepictureinpicture disableremoteplayback playsinline></video>` : `<iframe src="${esc(embed(url))}" allow="autoplay; encrypted-media" referrerpolicy="no-referrer"></iframe>`}
      <div class="vtop"></div><div class="wm" id="wm"></div><div class="vmask">${ic("shield")}<b>الفيديو متوقف</b><span>ارجع للصفحة عشان تكمل المشاهدة</span></div></div>
    <div class="vnote">${ic("shield")}المحتوى مرتبط بحسابك (${esc(P.name)}) وعليه علامة مائية. أي تسريب بيتتبع لحسابك.</div>`, "wide");
  const vb = $("vb"), wm = $("wm"), vid = vb.querySelector("video");
  const txt = `${P.name} • ${U.email}`, mv = () => { wm.textContent = txt; wm.style.top = (6 + Math.random() * 80) + "%"; wm.style.insetInlineStart = (3 + Math.random() * 55) + "%" };
  mv(); const t1 = setInterval(mv, 4500);
  const hide = () => { vb.classList.add("cover"); vid && vid.pause() }, show = () => vb.classList.remove("cover");
  const t2 = setInterval(() => document.hasFocus() && !document.hidden ? show() : hide(), 350);
  const key = e => { const k = (e.key || "").toLowerCase(), cs = e.ctrlKey || e.metaKey;
    if (k === "printscreen" || k === "f12" || (cs && ["p", "s", "u"].includes(k)) || (cs && e.shiftKey && ["i", "j", "c", "s", "3", "4", "5"].includes(k))) { e.preventDefault(); navigator.clipboard?.writeText(" ").catch(() => {}); hide(); setTimeout(show, 2200) } };
  const stop = e => e.preventDefault();
  addEventListener("keydown", key, true); addEventListener("keyup", key, true); vb.addEventListener("contextmenu", stop); vb.addEventListener("dragstart", stop);
  $("fs").onclick = () => vb.requestFullscreen?.().catch(() => {});
  guardOff = () => { clearInterval(t1); clearInterval(t2); removeEventListener("keydown", key, true); removeEventListener("keyup", key, true); document.fullscreenElement && document.exitFullscreen().catch(() => {}) };
  update(ref(db, `views/${c.teacherId}/${U.uid}_${l.id}`), { uid: U.uid, teacherId: c.teacherId, courseId: c.id || "", lectureId: l.id, name: P.name, lt: l.title, ct: c.title, count: increment(1), last: serverTimestamp() }).catch(() => {});
}

/* ============ الاشتراك ============ */
async function subscribe(c, it) {
  const pay = D.teachers[c.teacherId]?.pay || {}, ms = Object.values(pay.methods || {}).filter(m => m && m.number);
  modal(`${head("اشتراك: " + it.title)}<p style="margin-bottom:8px">المبلغ المطلوب: <b>${money(it.amount)}</b></p>
    <p class="mut" style="line-height:1.9;margin-bottom:14px">${esc(pay.instructions || "حوّل المبلغ على أحد الأرقام التالية، وبعدها صوّر شاشة التحويل بوضوح بحيث يظهر المبلغ ورقم العملية، وارفعها هنا. المدرس هيراجع طلبك ويفعّل اشتراكك في أقرب وقت.")}</p>
    ${ms.map(m => `<div class="pm"><div>${esc(m.name)}<br><span class="mono">${esc(m.number)}</span></div><button class="btn ghost sm" data-cp="${esc(m.number)}">${ic("copy")}نسخ</button></div>`).join("") || '<p class="empty">المدرس لسه مضافش طرق دفع. كلّمه مباشرة.</p>'}
    <div class="fld" style="margin-top:14px"><label for="shot">صورة التحويل</label><input id="shot" type="file" accept="image/*"></div><img id="pv" class="hide" style="max-width:100%;max-height:220px;border-radius:12px;margin-bottom:12px" alt="">
    <button class="btn block" id="send" disabled>إرسال الطلب</button>`);
  let img = null;
  $("mb").onclick = e => { const b = e.target.closest("[data-cp]"); if (b) { navigator.clipboard.writeText(b.dataset.cp); toast("تم نسخ الرقم") } };
  $("shot").onchange = async e => { if (!e.target.files[0]) return; img = await compress(e.target.files[0], 900, .6); $("pv").src = img; $("pv").classList.remove("hide"); $("send").disabled = false };
  $("send").onclick = async () => { $("send").disabled = true; $("send").classList.add("load");
    try { const rid = push(ref(db, "requests/" + c.teacherId)).key, now = serverTimestamp();
      await update(ref(db), {
        [`requests/${c.teacherId}/${rid}`]: { uid: U.uid, teacherId: c.teacherId, type: it.type, courseId: c.id, lectureId: it.lectureId || null, title: it.title, amount: it.amount || 0, name: P.name, phone: P.phone || "", email: U.email, status: "pending", createdAt: now },
        [`studentRequests/${U.uid}/${rid}`]: { teacherId: c.teacherId, title: it.title, amount: it.amount || 0, status: "pending", createdAt: now },
        [`receipts/${rid}`]: { uid: U.uid, teacherId: c.teacherId, img } });
      dlg.close(); toast("وصل طلبك، هتتفعّل الحصة تلقائي أول ما المدرس يوافق") }
    catch { toast("مقدرناش نبعت الطلب، جرّب تاني", false); $("send").disabled = false; $("send").classList.remove("load") } };
}

/* ============ حساب الطالب ============ */
function pageAccount() {
  pg(`<section class="sec" style="margin-top:0"><div class="sh"><div><h1 style="font-size:1.7rem">أهلاً ${esc(first(P.name))}</h1><span class="mut">${esc(U.email)}</span></div></div></section>
    <section class="sec"><div class="sh"><h2>كورساتي</h2></div><div class="grid" id="ml"></div></section>
    <section class="sec"><div class="sh"><h2>طلبات الاشتراك</h2></div><div class="card" id="rl" style="overflow:hidden"></div></section>
    <section class="sec"><button class="btn ghost" id="rp">${ic("mail")}ابعتلي لينك تغيير الباسوورد</button></section>`);
  const lab = { pending: ["wait", "قيد المراجعة"], approved: ["ok", "تمت الموافقة"], rejected: ["no", "مرفوض"] };
  paint = again => {
    const ids = [...new Set(arr(D.enr).map(e => e.courseId))].map(id => D.courses[id] && { id, ...D.courses[id] }).filter(Boolean);
    $("ml").innerHTML = ids.map(courseCard).join("") || emptyBox("book", "لسه مفيش اشتراكات مفعّلة. اتصفح الكورسات وابدأ.");
    $("rl").innerHTML = arr(D.myReqs).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(r => `<div class="lec"><div class="li"><b>${esc(r.title)}</b><small>${money(r.amount)} — ${day(r.createdAt)}${r.reason ? " — السبب: " + esc(r.reason) : ""}</small></div><span class="chip ${lab[r.status][0]}">${lab[r.status][1]}</span></div>`).join("") || `<div class="empty" style="border:0">${ic("wallet")}<div>مفيش طلبات لسه.</div></div>`;
    reveal(true);
  };
  $("rp").onclick = safe(async () => { await sendPasswordResetEmail(auth, U.email); toast("بعتنا اللينك على إيميلك") });
  paint();
}

/* ============ لوحة المدرس ============ */
function pageStudio(tab) {
  const tabs = [["req", "الطلبات", "bell"], ["courses", "كورساتي", "book"], ["students", "الطلاب", "users"], ["page", "صفحتي", "user"]];
  pg(`<section class="sec" style="margin-top:0"><div class="sh"><div><h1 style="font-size:1.7rem">لوحة التحكم</h1><span class="mut">أهلاً ${esc(first(P.name))}، كل حاجة بتتحدّث لحظياً.</span></div><a class="btn ghost sm" href="#/t/${U.uid}">${ic("eye")}شوف صفحتي</a></div></section>
    <div class="tabs" id="tb"></div><div id="tc"></div>`);
  const tabsHtml = () => { const n = arr(D.reqs).filter(r => r.status === "pending").length; $("tb").innerHTML = tabs.map(([k, t, i]) => `<a href="#/studio/${k}" class="${k === tab ? "on" : ""}">${ic(i)}${t}${k === "req" && n ? `<span class="cnt">${n}</span>` : ""}</a>`).join("") };
  const T = $("tc");
  if (tab === "req") {
    paint = () => { tabsHtml();
      T.innerHTML = arr(D.reqs).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).map(r => `<div class="card rq"><div class="row between"><b>${esc(r.title)}</b><span class="chip ${r.status === "approved" ? "ok" : r.status === "rejected" ? "no" : "wait"}">${r.status === "approved" ? "تمت الموافقة" : r.status === "rejected" ? "مرفوض" : "قيد المراجعة"}</span></div>
        <div class="kv"><div><span>الطالب</span><b>${esc(r.name)}</b></div><div><span>الموبايل</span><b dir="ltr">${esc(r.phone)}</b></div><div><span>الإيميل</span><b dir="ltr">${esc(r.email)}</b></div><div><span>المبلغ</span><b>${money(r.amount)}</b></div><div><span>النوع</span><b>${r.type === "course" ? "كورس كامل" : "حصة"}</b></div><div><span>التاريخ</span><b>${day(r.createdAt)}</b></div></div>
        ${r.reason ? `<p class="mut" style="margin-bottom:10px">سبب الرفض: ${esc(r.reason)}</p>` : ""}
        <div class="row"><button class="btn ghost sm" data-v="${r.id}">${ic("image")}صورة التحويل</button>${r.status === "pending" ? `<button class="btn sm" data-ok="${r.id}">${ic("check")}موافقة</button><button class="btn danger sm" data-no="${r.id}">${ic("x")}رفض</button>` : ""}</div></div>`).join("") || emptyBox("bell", "مفيش طلبات اشتراك لسه.");
    };
    T.onclick = safe(async e => { const b = e.target.closest("button"); if (!b) return; const id = b.dataset.v || b.dataset.ok || b.dataset.no, r = D.reqs[id] && { id, ...D.reqs[id] }; if (!r) return;
      const mail = (s, m) => r.email ? sendMail(EMAILJS.approval, { to_email: r.email, to_name: r.name, subject: s, message: m }) : false;
      if (b.dataset.v) { modal(`${head("صورة التحويل")}<p class="mut">لحظة…</p>`); const v = (await get(ref(db, "receipts/" + id))).val(); modal(`${head("صورة التحويل")}${v ? `<img src="${v.img}" style="max-width:100%;border-radius:14px" alt="">` : '<p class="empty">الصورة مش موجودة.</p>'}`) }
      if (b.dataset.ok) { b.disabled = true; const key = r.type === "course" ? r.courseId : r.lectureId;
        await update(ref(db), { [`enrollments/${r.uid}/${key}`]: { teacherId: U.uid, courseId: r.courseId, lectureId: r.lectureId || null, at: serverTimestamp() }, [`requests/${U.uid}/${id}/status`]: "approved", [`requests/${U.uid}/${id}/decidedAt`]: serverTimestamp(), [`studentRequests/${r.uid}/${id}/status`]: "approved" });
        const sent = await mail("تمت الموافقة على اشتراكك", `تمت الموافقة على طلبك للاشتراك في "${r.title}". تقدر تدخل المنصة وتبدأ المشاهدة دلوقتي.`); toast(sent ? "تمت الموافقة وبعتنا رسالة للطالب" : "تمت الموافقة (الرسالة ماتبعتتش، راجع EmailJS)") }
      if (b.dataset.no) { const v = await ask("رفض الطلب", [{ k: "reason", label: "سبب الرفض (هيظهر للطالب)", req: 1 }], "رفض"); if (!v) return;
        await update(ref(db), { [`requests/${U.uid}/${id}/status`]: "rejected", [`requests/${U.uid}/${id}/reason`]: v.reason, [`requests/${U.uid}/${id}/decidedAt`]: serverTimestamp(), [`studentRequests/${r.uid}/${id}/status`]: "rejected", [`studentRequests/${r.uid}/${id}/reason`]: v.reason });
        await mail("بخصوص طلب اشتراكك", `للأسف تعذّر قبول طلبك للاشتراك في "${r.title}". السبب: ${v.reason}.`); toast("تم الرفض") } });
  }
  if (tab === "courses") {
    paint = again => { tabsHtml(); const cs = coursesOf(U.uid);
      T.innerHTML = `<div class="grid"><button class="card cc" id="nc" style="min-height:240px;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:2px dashed #cfd5ea;box-shadow:none;background:rgba(255,255,255,.6);color:var(--p);font-weight:700">${ic("plus")}<span>كورس جديد</span></button>${cs.map(courseCard).join("")}</div>`;
      $("nc").onclick = addCourse; reveal(true) };
  }
  if (tab === "students") {
    T.innerHTML = `<div class="sh"><h2>المشاهدات</h2></div><div class="srch" style="max-width:none;margin-bottom:14px">${ic("search")}<input id="q" placeholder="ابحث باسم الطالب أو الحصة"></div><div class="card tw" id="vw"></div><div class="sh" style="margin-top:34px"><h2>الطلاب المشتركين</h2></div><div class="card tw" id="st"></div>`;
    paint = () => { tabsHtml(); const f = $("q").value.trim().toLowerCase();
      $("vw").innerHTML = `<table><thead><tr><th>الطالب</th><th>الكورس</th><th>الحصة</th><th>المشاهدات</th><th>آخر مشاهدة</th></tr></thead><tbody>${arr(D.views).filter(v => !f || (v.name + " " + v.lt + " " + v.ct).toLowerCase().includes(f)).sort((a, b) => (b.last || 0) - (a.last || 0)).map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.ct)}</td><td>${esc(v.lt)}</td><td>${v.count || 1}</td><td>${day(v.last)}</td></tr>`).join("") || '<tr><td colspan="5" class="mut">مفيش مشاهدات.</td></tr>'}</tbody></table>`;
      const m = {}; arr(D.reqs).filter(r => r.status === "approved").forEach(r => { (m[r.uid] ||= { name: r.name, phone: r.phone, email: r.email, n: 0 }).n++ });
      $("st").innerHTML = `<table><thead><tr><th>الاسم</th><th>الموبايل</th><th>الإيميل</th><th>اشتراكات</th></tr></thead><tbody>${Object.values(m).map(s => `<tr><td>${esc(s.name)}</td><td dir="ltr">${esc(s.phone)}</td><td dir="ltr">${esc(s.email)}</td><td>${s.n}</td></tr>`).join("") || '<tr><td colspan="4" class="mut">مفيش طلاب لسه.</td></tr>'}</tbody></table>` };
    $("q").oninput = () => paint();
  }
  if (tab === "page") {
    const t = D.teachers[U.uid] || {}, pay = t.pay || {}, ms = Object.values(pay.methods || {}), link = location.origin + location.pathname + "#/t/" + U.uid;
    T.innerHTML = `<div class="two"><div class="card pad"><h3>بيانات صفحتي</h3>
      <div class="fld"><label for="s-n">الاسم</label><input id="s-n" value="${esc(t.name || P.name)}"></div><div class="fld"><label for="s-t">التخصص</label><input id="s-t" value="${esc(t.title || "")}" placeholder="مثال: مدرس رياضيات"></div>
      <div class="fld"><label for="s-b">نبذة عنك</label><textarea id="s-b" rows="4">${esc(t.bio || "")}</textarea></div><div class="fld"><label for="s-p">صورتك الشخصية</label><input id="s-p" type="file" accept="image/*"></div>
      <div class="fld"><label>رابط صفحتك</label><div class="row"><input readonly dir="ltr" value="${esc(link)}" style="flex:1;min-width:180px"><button class="btn ghost sm" id="cl">${ic("copy")}نسخ</button></div></div>
      <button class="btn" id="sv">حفظ البيانات</button></div>
      <div><div class="card pad" style="margin-bottom:20px"><h3>طرق الدفع</h3>${[0, 1, 2].map(i => `<div class="row" style="margin-bottom:10px"><input style="flex:1;min-width:130px" id="pn${i}" placeholder="الطريقة (فودافون كاش)" value="${esc(ms[i]?.name || "")}"><input style="flex:1;min-width:130px" dir="ltr" id="pm${i}" placeholder="الرقم" value="${esc(ms[i]?.number || "")}"></div>`).join("")}
        <div class="fld"><label for="pi">رسالة الدفع للطالب (اختياري)</label><textarea id="pi" rows="3">${esc(pay.instructions || "")}</textarea></div><button class="btn" id="sp">حفظ طرق الدفع</button></div>
      <div class="card pad"><h3>تغيير الباسوورد</h3><div class="fld"><label for="po">الحالي</label><input id="po" type="password" autocomplete="current-password"></div><div class="fld"><label for="pn">الجديد</label><input id="pnw" type="password" autocomplete="new-password"></div><button class="btn ghost" id="cp">تغيير الباسوورد</button></div></div></div>`;
    paint = () => tabsHtml();
    $("cl").onclick = () => { navigator.clipboard.writeText(link); toast("تم نسخ الرابط") };
    $("sv").onclick = safe(async () => { const name = $("s-n").value.trim(); if (name.length < 2) return toast("اكتب الاسم", false);
      const u = { [`teachers/${U.uid}/name`]: name, [`teachers/${U.uid}/title`]: $("s-t").value.trim(), [`teachers/${U.uid}/bio`]: $("s-b").value.trim(), [`users/${U.uid}/name`]: name }; const f = $("s-p").files[0]; if (f) u[`teachers/${U.uid}/photo`] = await compress(f, 400, .75);
      await update(ref(db), u); P.name = name; toast("تم حفظ بيانات الصفحة") });
    $("sp").onclick = safe(async () => { const methods = [0, 1, 2].map(i => ({ name: $("pn" + i).value.trim(), number: $("pm" + i).value.trim() })).filter(m => m.number);
      await update(ref(db), { [`teachers/${U.uid}/pay`]: { instructions: $("pi").value.trim(), methods: methods.length ? methods : null } }); toast("تم حفظ طرق الدفع") });
    $("cp").onclick = safe(async () => { try { await reauthenticateWithCredential(U, EmailAuthProvider.credential(U.email, $("po").value)); await updatePassword(U, $("pnw").value); $("po").value = $("pnw").value = ""; toast("تم تغيير الباسوورد") }
      catch (e) { toast(e.code === "auth/weak-password" ? "الباسوورد الجديد ضعيف" : "الباسوورد الحالي غلط", false) } });
  }
  paint();
}

/* ============ البداية ============ */
onAuthStateChanged(auth, u => { if (holding) return; if (u) { if (!U || U.uid !== u.uid) enter(u).catch(e => { console.error(e); toast("تعذّر تحميل البيانات. اتأكد من databaseURL والرولز", false); signOut(auth) }) } else leave() });
</script>
