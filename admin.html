<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#10201d;--mut:#5d706b;--line:#d5e0dc;--board:#17352f;--board2:#10261f;--pencil:#f5c542;--err:#c0392b;--ok:#1d7a4f}
@media(prefers-color-scheme:dark){:root{--bg:#0d1715;--card:#15231f;--ink:#e8f0ed;--mut:#8fa59f;--line:#263a35;--err:#ff8a7a;--ok:#5fd39b}}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
.nav{background:linear-gradient(160deg,var(--board),var(--board2));color:#f1f5f2;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:6px solid #7a5a35;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:"Reem Kufi","Cairo",sans-serif;font-weight:700;font-size:1.4rem;color:#fff;text-decoration:none;margin-inline-end:auto}
.nav a.l{color:#c4d6d0;text-decoration:none;font-weight:600}
.hero{background:linear-gradient(160deg,var(--board),var(--board2));color:#f1f5f2;padding:44px 20px 70px;text-align:right}
.hero>div{max-width:1000px;margin:0 auto}
.hero h1{font-family:"Reem Kufi","Cairo",sans-serif;font-size:clamp(2rem,6vw,3.4rem);margin:0 0 10px;line-height:1.25}
.hero p{margin:0 0 22px;max-width:36rem;color:#c4d6d0;font-size:1.1rem;line-height:1.8}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 50px}
.up{margin-top:-36px}
h2{margin:26px 0 12px;font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.course{padding:0;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;border-top:5px solid var(--pencil)}
.course .im{aspect-ratio:16/9;width:100%;object-fit:cover;background:linear-gradient(160deg,var(--board),var(--board2));display:flex;align-items:center;justify-content:center;color:var(--pencil);font:700 3rem "Reem Kufi",sans-serif}
.course .tx{padding:14px}.course h3{margin:0 0 6px}.course p{margin:0;color:var(--mut);font-size:.93rem;line-height:1.7}
.btn{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;padding:9px 15px;background:var(--board);color:#fff;text-decoration:none;display:inline-block}
.btn.pencil{background:var(--pencil);color:#2a2200}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.nav .btn.ghost{color:#fff;border-color:#ffffff66}
.btn.danger{background:transparent;color:var(--err);border:1px solid var(--err)}
.btn:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
label{display:block;font-weight:600;margin:0 0 4px;font-size:.92rem}
input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;margin-bottom:10px}
select option{color:#000}
dialog{border:0;border-radius:14px;padding:18px;width:min(560px,94vw);background:var(--card);color:var(--ink);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(5,15,12,.65)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:16px 0}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.85rem;font-weight:700;background:var(--line)}
.chip.ok{background:var(--ok);color:#fff}.chip.no{background:var(--err);color:#fff}.chip.wait{background:var(--pencil);color:#2a2200}
.lec{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.lec:last-child{border:0}
.video{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pm{border:1px dashed var(--mut);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.num{font:700 1.15rem ui-monospace,Consolas,monospace;direction:ltr;letter-spacing:1px}
.prev{max-width:100%;max-height:260px;border-radius:8px;margin-bottom:10px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:420px;margin:auto;padding:12px 16px;border-radius:10px;color:#fff;font-weight:600;z-index:99;text-align:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:.9rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs .btn[aria-selected=true]{background:var(--pencil);color:#2a2200}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><title>لوحة تحكم المعلمة</title></head><body>

<div id="loginV" class="wrap" style="max-width:420px;padding-top:60px"><div class="card">
  <h2 style="margin-top:0">دخول المعلمة</h2>
  <label for="em">الإيميل</label><input id="em" type="email" dir="ltr"><label for="pw">الباسوورد</label><input id="pw" type="password">
  <button class="btn" id="lg" style="width:100%">دخول</button><div class="row" style="margin-top:10px"><button class="btn ghost" id="fp">نسيت الباسوورد؟</button><a class="btn ghost" href="index.html">← الموقع</a></div><p id="lm" style="color:var(--err);font-weight:600"></p></div></div>

<div id="appV" class="hide">
<div class="nav"><span class="brand">لوحة التحكم</span><a class="l" href="index.html">← الموقع</a><button class="btn ghost" id="out">خروج</button></div>
<main class="wrap">
  <div class="tabs" id="tabs">
    <button class="btn" data-t="req" aria-selected="true">الطلبات <span id="cnt"></span></button>
    <button class="btn" data-t="crs" aria-selected="false">الكورسات والحصص</button>
    <button class="btn" data-t="stu" aria-selected="false">الطلاب والمشاهدات</button>
    <button class="btn" data-t="set" aria-selected="false">الإعدادات وطرق الدفع</button>
  </div>

  <section id="t-req" class="sec"><div id="reqL"></div></section>

  <section id="t-crs" class="sec hide">
    <div class="card"><h3 style="margin-top:0">إضافة كورس</h3>
      <label for="c-t">اسم الكورس</label><input id="c-t"><label for="c-d">وصف الكورس</label><input id="c-d">
      <label for="c-i">صورة الكورس (اختياري)</label><input id="c-i" type="file" accept="image/*">
      <button class="btn pencil" id="addC">إضافة الكورس</button></div>
    <div id="crsL"></div>
  </section>

  <section id="t-stu" class="sec hide">
    <h2 style="margin-top:0">المشاهدات</h2><input id="q" placeholder="ابحث بالاسم أو الرقم القومي أو الحصة">
    <div class="card tw"><table><thead><tr><th>الطالب</th><th>الرقم القومي</th><th>الحصة</th><th>عدد المشاهدات</th><th>آخر مشاهدة</th></tr></thead><tbody id="viewL"></tbody></table></div>
    <h2>كل الطلاب</h2>
    <div class="card tw"><table><thead><tr><th>الاسم</th><th>الرقم القومي</th><th>الموبايل</th><th>الإيميل</th></tr></thead><tbody id="stuL"></tbody></table></div>
  </section>

  <section id="t-set" class="sec hide"><div class="card">
    <label for="s-n">اسم المنصة أو المعلمة</label><input id="s-n"><label for="s-g">جملة تحت الاسم في الصفحة الرئيسية</label><input id="s-g">
    <h3>طرق الدفع (اترك الفاضي لو مش مستخدمه)</h3>
    <div id="pmL"></div>
    <label for="s-i">رسالة الدفع للطالب (اختياري، فيه رسالة جاهزة محترمة لو سبتها فاضية)</label><textarea id="s-i" rows="3"></textarea>
    <button class="btn pencil" id="saveS">حفظ الإعدادات</button></div>
    <div class="card"><h3 style="margin-top:0">تغيير الباسوورد</h3><label for="cp-o">الباسوورد الحالي</label><input id="cp-o" type="password" autocomplete="current-password">
      <label for="cp-n">الباسوورد الجديد (6 حروف على الأقل)</label><input id="cp-n" type="password" autocomplete="new-password"><button class="btn pencil" id="chP">تغيير الباسوورد</button></div></section>
  <p id="msg" role="status" style="font-weight:600"></p>
</main></div>

<dialog id="dlg"><img id="big" class="prev" style="max-height:80vh" alt=""><div class="row"><button class="btn ghost" id="cl">إغلاق</button></div></dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { collection, getDocs, getDoc, setDoc, addDoc, updateDoc, deleteDoc, doc, writeBatch, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg = {
  apiKey: "AIzaSyCULtaLm5UC36yBNibAFI4Lq2AebN6YvjE",
  authDomain: "education-ea665.firebaseapp.com",
  projectId: "education-ea665",
  storageBucket: "education-ea665.firebasestorage.app",
  messagingSenderId: "569337898526",
  appId: "1:569337898526:web:7cc09f35b3f357fb7b300f"
};
const app = initializeApp(cfg), auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n ? n + " ج.م" : "مجاني";
function toast(t, ok = true){
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role","status");
  d.style.background = ok ? "var(--ok)" : "var(--err)"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 4200);
}
function compress(file, w = 900, q = .6){
  return new Promise(res => { const r = new FileReader();
    r.onload = () => { const i = new Image(); i.onload = () => { const k = Math.min(1, w / i.width), c = document.createElement("canvas");
      c.width = i.width * k; c.height = i.height * k; c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", q)) }; i.src = r.result };
    r.readAsDataURL(file) });
}
const EMAILJS = { service: "service_6boa519", publicKey: "_YXlKwxDWLdxG-_DB", approval: "template_g9kjv6u", welcome: "template_898wgo5" };
async function sendMail(template, params){
  try{ const r = await fetch("https://api.emailjs.com/api/v1.0/email/send", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({service_id:EMAILJS.service, template_id:template, user_id:EMAILJS.publicKey, template_params:params})}); return r.ok }catch{ return false }
}

const genCode = () => { const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b=crypto.getRandomValues(new Uint32Array(8)); return [...b].map(x=>a[x%a.length]).join("") };
const say = (t, ok=true) => toast(t, ok);
const all = async (c, o) => (await getDocs(o ? query(collection(db,c), orderBy(o)) : collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const day = t => t?.seconds ? new Date(t.seconds*1000).toLocaleString("ar-EG") : "—";
let D = {};

$("lg").onclick = async () => { try{ await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value) }catch{ $("lm").style.color = "var(--err)"; $("lm").textContent = "الإيميل أو الباسوورد غلط" } };
$("out").onclick = () => signOut(auth);
$("fp").onclick = async () => { const e = $("em").value.trim(); if(!e){ $("lm").style.color = "var(--err)"; $("lm").textContent = "اكتب الإيميل الأول"; return }
  try{ await sendPasswordResetEmail(auth, e); $("lm").style.color = "var(--ok)"; $("lm").textContent = "بعتنا لينك تغيير الباسوورد على الإيميل. راجع الـ Spam كمان." }
  catch{ $("lm").style.color = "var(--err)"; $("lm").textContent = "مقدرناش نبعت. اتأكد من الإيميل" } };
onAuthStateChanged(auth, u => { $("loginV").classList.toggle("hide", !!u); $("appV").classList.toggle("hide", !u); if(u) load() });
$("tabs").onclick = e => { const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#tabs .btn").forEach(x=>x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".sec").forEach(s=>s.classList.toggle("hide", s.id !== "t-"+b.dataset.t)) };
$("cl").onclick = () => $("dlg").close();

async function load(){
  try{
    const [courses, lectures, unlock, students, requests, views, site, pay] = await Promise.all([
      all("courses","position"), all("lectures"), all("unlock"), all("students"), all("requests","createdAt"), all("views"),
      getDoc(doc(db,"settings","site")), getDoc(doc(db,"settings","payment"))]);
    D = { courses, lectures: lectures.sort((a,b)=>(a.position||0)-(b.position||0)), students, requests: requests.reverse(), views,
      codes: Object.fromEntries(unlock.map(u=>[u.lectureId,{code:u.id, url:u.videoUrl}])), S: Object.fromEntries(students.map(s=>[s.id,s])),
      site: site.data()||{}, pay: pay.data()||{} };
    renderReq(); renderCrs(); renderStu(); renderSet();
  }catch(e){
    if(e.code === "permission-denied"){ await signOut(auth); $("lm").style.color = "var(--err)"; $("lm").textContent = "الحساب ده مش حساب المعلمة، أو إيميل المعلمة مش مكتوب صح في firestore.rules." }
    else say("مقدرناش نقرا البيانات. جرّب تاني.", false) }
}

// ---------- الطلبات ----------
function renderReq(){
  const p = D.requests.filter(r=>r.status==="pending").length; $("cnt").textContent = p ? `(${p})` : "";
  $("reqL").innerHTML = D.requests.map(r => { const s = D.S[r.uid]||{};
    return `<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${esc(r.title)}</b>
      <span class="chip ${r.status==="approved"?"ok":r.status==="rejected"?"no":"wait"}">${r.status==="approved"?"تمت الموافقة":r.status==="rejected"?"مرفوض":"قيد المراجعة"}</span></div>
      <p style="line-height:1.9;margin:8px 0">الاسم: <b>${esc(s.name)}</b><br>الرقم القومي: <b dir="ltr">${esc(s.nationalId)}</b><br>الموبايل: ${esc(s.phone)} — الإيميل: ${esc(s.email)}<br>
      النوع: ${r.type==="course"?"اشتراك كورس كامل":"اشتراك حصة"} — المبلغ: <b>${money(r.amount)}</b> — ${day(r.createdAt)}${r.reason?`<br>سبب الرفض: ${esc(r.reason)}`:""}</p>
      <div class="row">${r.screenshot?`<button class="btn ghost" data-v="${r.id}">عرض صورة التحويل</button>`:""}
      ${r.status==="pending"?`<button class="btn pencil" data-ok="${r.id}">موافقة</button><button class="btn danger" data-no="${r.id}">رفض</button>`:""}</div></div>` }).join("") || '<p class="empty">مفيش طلبات لسه.</p>';
}
async function mail(r, subject, message){
  const s = D.S[r.uid]||{}; return s.email ? sendMail(EMAILJS.approval, {to_email:s.email, to_name:s.name, subject, message}) : false;
}
$("reqL").onclick = async e => {
  const b = e.target.closest("button"); if(!b) return;
  const r = D.requests.find(x => x.id === (b.dataset.v||b.dataset.ok||b.dataset.no)); if(!r) return;
  if(b.dataset.v){ $("big").src = r.screenshot; $("dlg").showModal() }
  if(b.dataset.ok){ b.disabled = true;
    try{ const w = writeBatch(db), key = r.uid+"_"+(r.type==="course"?r.courseId:r.lectureId);
      w.set(doc(db,"enrollments",key), {uid:r.uid, courseId:r.courseId, lectureId:r.lectureId||null, at:serverTimestamp()});
      w.update(doc(db,"requests",r.id), {status:"approved", decidedAt:serverTimestamp()}); await w.commit();
      const sent = await mail(r, "تمت الموافقة على اشتراكك", `تمت الموافقة على طلبك للاشتراك في "${r.title}". تقدر تدخل المنصة وتبدأ المشاهدة دلوقتي.`);
      say(sent ? "تمت الموافقة وبعتنا رسالة للطالب" : "تمت الموافقة (الرسالة ماتبعتتش: راجع إعدادات EmailJS)"); load() }
    catch(err){ say("حصل خطأ: "+err.message, false); b.disabled = false } }
  if(b.dataset.no){ const reason = prompt("سبب الرفض (هيظهر للطالب):"); if(reason === null) return;
    await updateDoc(doc(db,"requests",r.id), {status:"rejected", reason, decidedAt:serverTimestamp()});
    await mail(r, "بخصوص طلب اشتراكك", `للأسف تعذّر قبول طلبك للاشتراك في "${r.title}". السبب: ${reason}. تقدر ترسل طلب جديد من المنصة.`); say("تم الرفض"); load() }
};

// ---------- الكورسات والحصص ----------
function renderCrs(){
  $("crsL").innerHTML = D.courses.map(c => `<div class="card" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(c.title)}</h3>
      <div class="row"><button class="btn ghost" data-ec="${c.id}">تعديل</button><button class="btn danger" data-dc="${c.id}">حذف الكورس</button></div></div>
    ${D.lectures.filter(l=>l.courseId===c.id).map(l => { const k = D.codes[l.id]||{};
      return `<div class="lec"><div><b>${esc(l.title)}</b> <span class="chip">${money(l.price)}</span><br><span class="num">${esc(k.code||"—")}</span></div>
      <div class="row"><button class="btn ghost" data-cp="${l.id}">نسخ الكود</button><button class="btn" data-nc="${l.id}">كود جديد</button>
      <button class="btn ghost" data-el="${l.id}">تعديل</button><button class="btn danger" data-dl="${l.id}">حذف</button></div></div>` }).join("") || '<p class="empty">مفيش حصص.</p>'}
    <h4>إضافة حصة</h4><div class="row"><input style="flex:2;min-width:160px" placeholder="عنوان الحصة" id="lt-${c.id}"><input style="flex:1;min-width:90px" type="number" min="0" placeholder="السعر (0 = مجاني)" id="lp-${c.id}"></div>
    <input placeholder="وصف قصير (اختياري)" id="ld-${c.id}"><input dir="ltr" placeholder="لينك الفيديو https://" id="lu-${c.id}">
    <button class="btn pencil" data-al="${c.id}">إضافة الحصة</button></div>`).join("") || '<p class="empty">ضيف أول كورس من الفورم اللي فوق.</p>';
}
$("addC").onclick = async () => { const t = $("c-t").value.trim(); if(!t) return say("اكتب اسم الكورس", false);
  const f = $("c-i").files[0]; await addDoc(collection(db,"courses"), {title:t, description:$("c-d").value.trim(), image: f ? await compress(f,800,.7) : null, position:D.courses.length, createdAt:serverTimestamp()});
  ["c-t","c-d","c-i"].forEach(i=>$(i).value=""); say("تمت إضافة الكورس"); load() };
$("crsL").onclick = async e => {
  const b = e.target.closest("button"); if(!b) return; const d = b.dataset;
  try{
    if(d.al){ const t = $("lt-"+d.al).value.trim(), u = $("lu-"+d.al).value.trim(), p = Math.max(0, +$("lp-"+d.al).value || 0);
      if(!t || !u) return say("اكتب عنوان الحصة ولينك الفيديو", false);
      const ref = await addDoc(collection(db,"lectures"), {courseId:d.al, title:t, description:$("ld-"+d.al).value.trim(), price:p, position:D.lectures.length, createdAt:serverTimestamp()});
      const w = writeBatch(db); w.set(doc(db,"videos",ref.id), {courseId:d.al, videoUrl:u, free:p===0}); w.set(doc(db,"unlock",genCode()), {lectureId:ref.id, courseId:d.al, videoUrl:u});
      await w.commit(); say("تمت إضافة الحصة"); load() }
    if(d.cp){ await navigator.clipboard.writeText(D.codes[d.cp].code); say("تم نسخ الكود") }
    if(d.nc){ if(!confirm("الكود القديم هيبطل يشتغل. تكمّل؟")) return; const k = D.codes[d.nc], w = writeBatch(db), l = D.lectures.find(x=>x.id===d.nc);
      w.delete(doc(db,"unlock",k.code)); w.set(doc(db,"unlock",genCode()), {lectureId:d.nc, courseId:l.courseId, videoUrl:k.url}); await w.commit(); say("تم تغيير الكود"); load() }
    if(d.el){ const l = D.lectures.find(x=>x.id===d.el), k = D.codes[l.id]||{};
      const t = prompt("عنوان الحصة", l.title); if(t===null) return; const p = prompt("السعر (0 = مجاني)", l.price||0); if(p===null) return; const u = prompt("لينك الفيديو", k.url||""); if(u===null) return;
      const pr = Math.max(0, +p || 0), w = writeBatch(db); w.update(doc(db,"lectures",l.id), {title:t.trim(), price:pr});
      w.set(doc(db,"videos",l.id), {courseId:l.courseId, videoUrl:u.trim(), free:pr===0}); if(k.code) w.update(doc(db,"unlock",k.code), {videoUrl:u.trim()}); await w.commit(); say("تم التعديل"); load() }
    if(d.dl){ if(!confirm("حذف الحصة نهائياً؟")) return; const w = writeBatch(db), k = D.codes[d.dl]; w.delete(doc(db,"lectures",d.dl)); w.delete(doc(db,"videos",d.dl)); if(k) w.delete(doc(db,"unlock",k.code)); await w.commit(); load() }
    if(d.dc){ if(!confirm("هيتحذف الكورس وكل حصصه نهائياً. تكمّل؟")) return; const w = writeBatch(db); w.delete(doc(db,"courses",d.dc));
      D.lectures.filter(l=>l.courseId===d.dc).forEach(l => { w.delete(doc(db,"lectures",l.id)); w.delete(doc(db,"videos",l.id)); const k = D.codes[l.id]; if(k) w.delete(doc(db,"unlock",k.code)) }); await w.commit(); load() }
    if(d.ec){ const c = D.courses.find(x=>x.id===d.ec); const t = prompt("اسم الكورس", c.title); if(t===null) return; const ds = prompt("الوصف", c.description||""); if(ds===null) return;
      await updateDoc(doc(db,"courses",c.id), {title:t.trim(), description:ds.trim()}); say("تم التعديل"); load() }
  }catch(err){ say("حصل خطأ: "+err.message, false) }
};

// ---------- الطلاب والمشاهدات ----------
function renderStu(){
  const lt = id => (D.lectures.find(l=>l.id===id)||{}).title || "—", f = $("q").value.trim().toLowerCase();
  const rows = D.views.map(v => ({s: D.S[v.uid]||{}, l: lt(v.lectureId), v})).filter(x => !f || [x.s.name, x.s.nationalId, x.l].join(" ").toLowerCase().includes(f));
  $("viewL").innerHTML = rows.map(x=>`<tr><td>${esc(x.s.name)}</td><td dir="ltr">${esc(x.s.nationalId)}</td><td>${esc(x.l)}</td><td>${x.v.count||1}</td><td>${day(x.v.last)}</td></tr>`).join("") || '<tr><td colspan="5" class="empty">مفيش مشاهدات.</td></tr>';
  $("stuL").innerHTML = D.students.map(s=>`<tr><td>${esc(s.name)}</td><td dir="ltr">${esc(s.nationalId)}</td><td dir="ltr">${esc(s.phone)}</td><td dir="ltr">${esc(s.email)}</td></tr>`).join("") || '<tr><td colspan="4" class="empty">مفيش طلاب مسجلين.</td></tr>';
}
$("q").oninput = renderStu;

$("chP").onclick = async () => { try{ const u = auth.currentUser;
  await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, $("cp-o").value)); await updatePassword(u, $("cp-n").value);
  $("cp-o").value = $("cp-n").value = ""; say("تم تغيير الباسوورد") }catch(e){ say(e.code === "auth/weak-password" ? "الباسوورد الجديد ضعيف" : "الباسوورد الحالي غلط", false) } };

// ---------- الإعدادات ----------
function renderSet(){
  $("s-n").value = D.site.schoolName||""; $("s-g").value = D.site.tagline||""; $("s-i").value = D.pay.instructions||"";
  const ms = D.pay.methods||[]; $("pmL").innerHTML = [0,1,2].map(i=>`<div class="row"><input style="flex:1;min-width:140px" id="pn-${i}" placeholder="اسم الطريقة (مثلاً فودافون كاش)" value="${esc(ms[i]?.name||"")}"><input style="flex:1;min-width:140px" dir="ltr" id="pm-${i}" placeholder="الرقم" value="${esc(ms[i]?.number||"")}"></div>`).join("");
}
$("saveS").onclick = async () => { try{
  await setDoc(doc(db,"settings","site"), {schoolName:$("s-n").value.trim(), tagline:$("s-g").value.trim()});
  await setDoc(doc(db,"settings","payment"), {instructions:$("s-i").value.trim(), methods:[0,1,2].map(i=>({name:$("pn-"+i).value.trim(), number:$("pm-"+i).value.trim()})).filter(m=>m.number)});
  say("تم حفظ الإعدادات"); load() }catch(err){ say("حصل خطأ: "+err.message, false) } };
</script></body></html>
